name: Deploy Docker to VPS

on:
  push:
    branches:
      - main

concurrency:
  group: production-deployment
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      APP_NAME: masjid-semilyar-tangan
      APP_PORT: 3000
      IMAGE_NAME: masjid-semilyar-tangan:${{ github.sha }}
      IMAGE_FILE: masjid-semilyar-tangan-${{ github.sha }}.tar

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_AUTH_URL="${{ vars.NEXT_PUBLIC_AUTH_URL }}" \
            --build-arg NEXT_PUBLIC_ROOT_DOMAIN="${{ vars.NEXT_PUBLIC_ROOT_DOMAIN }}" \
            --build-arg DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            -t "$IMAGE_NAME" \
            .

      - name: Save Docker image
        run: docker save "$IMAGE_NAME" -o "$IMAGE_FILE"

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Upload Docker image
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          scp \
            -i ~/.ssh/deploy_key \
            -P "$VPS_PORT" \
            "$IMAGE_FILE" \
            "$VPS_USER@$VPS_HOST:/tmp/$IMAGE_FILE"

      - name: Run Docker container
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" \
            "APP_NAME='$APP_NAME' \
             APP_PORT='$APP_PORT' \
             IMAGE_NAME='$IMAGE_NAME' \
             IMAGE_FILE='$IMAGE_FILE' \
             bash -s" <<'REMOTE_SCRIPT'

          set -euo pipefail

          docker load -i "/tmp/$IMAGE_FILE"
          rm -f "/tmp/$IMAGE_FILE"

          docker rm -f "$APP_NAME" >/dev/null 2>&1 || true
          docker run -d \
            --name "$APP_NAME" \
            --restart unless-stopped \
            --env-file "/var/www/$APP_NAME/.env" \
            -e PORT="$APP_PORT" \
            -p "127.0.0.1:$APP_PORT:$APP_PORT" \
            "$IMAGE_NAME"

          docker image prune -f

          REMOTE_SCRIPT
